<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">DNS-Hierarchie: Wie wird ein Name im Internet aufgelöst?</title>
  <desc id="desc">Der Mitarbeiter-PC fragt OpenWrt. OpenWrt leitet an einen rekursiven Resolver weiter. Dieser folgt der DNS-Hierarchie von der Root-Zone über die Top-Level-Domain de zum autoritativen Nameserver und erhält die IP-Adresse.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#173B2E" flood-opacity="0.11"/>
    </filter>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #18251F; }
      .title { font-size: 40px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #596B63; }
      .section { font-size: 25px; font-weight: 700; }
      .card-title { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; fill: #43564D; }
      .small { font-size: 16px; fill: #5C6D65; }
      .step { font-size: 18px; font-weight: 700; fill: #FFFFFF; }
      .record { font-size: 21px; font-weight: 700; fill: #176A49; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#F8FAF9"/>

  <text x="800" y="60" text-anchor="middle" class="title">Wie findet DNS die richtige IP-Adresse?</text>
  <text x="800" y="96" text-anchor="middle" class="subtitle">Beispielanfrage: www.meinefirma.de</text>

  <!-- Local company network -->
  <rect x="60" y="150" width="430" height="650" rx="30" fill="#EAF4EF" stroke="#7EAD99" stroke-width="3"/>
  <text x="95" y="200" class="section" fill="#195E43">Im Firmennetz</text>
  <text x="95" y="230" class="small">192.168.1.0/24</text>

  <!-- Employee client -->
  <g transform="translate(100 275)">
    <rect x="0" y="0" width="350" height="155" rx="22" fill="#FFFFFF" stroke="#ACC5D4" stroke-width="2" filter="url(#shadow)"/>
    <g transform="translate(25 43)" fill="none" stroke="#416981" stroke-width="4">
      <rect x="0" y="0" width="72" height="47" rx="6"/>
      <path d="M-6 60 H78 L70 47 H2 Z"/>
    </g>
    <text x="125" y="57" class="card-title">Mitarbeiter-PC</text>
    <text x="125" y="87" class="record">192.168.1.103</text>
    <text x="125" y="119" class="body">fragt: „Welche IP hat</text>
    <text x="125" y="144" class="body">www.meinefirma.de?“</text>
  </g>

  <!-- Step 1 -->
  <line x1="275" y1="430" x2="275" y2="495" stroke="#237A57" stroke-width="5"/>
  <circle cx="275" cy="462" r="20" fill="#237A57"/>
  <text x="275" y="468" text-anchor="middle" class="step">1</text>

  <!-- OpenWrt DNS -->
  <g transform="translate(100 495)">
    <rect x="0" y="0" width="350" height="190" rx="22" fill="#FFFFFF" stroke="#9FC4B4" stroke-width="2" filter="url(#shadow)"/>
    <g transform="translate(25 42)" fill="none" stroke="#176A49" stroke-width="4">
      <rect x="0" y="0" width="74" height="49" rx="9"/>
      <line x1="13" y1="16" x2="61" y2="16"/>
      <circle cx="19" cy="35" r="4" fill="#176A49" stroke="none"/>
      <circle cx="35" cy="35" r="4" fill="#176A49" stroke="none"/>
      <path d="M51 37 L59 29 L67 37"/>
    </g>
    <text x="125" y="58" class="card-title">OpenWrt-DNS</text>
    <text x="125" y="88" class="record">192.168.1.1</text>
    <text x="25" y="130" class="body">prüft zunächst seinen Cache</text>
    <text x="25" y="160" class="body">und leitet die Anfrage weiter</text>
  </g>

  <!-- Step 2 connection -->
  <line x1="450" y1="590" x2="605" y2="590" stroke="#C58A16" stroke-width="5"/>
  <circle cx="530" cy="590" r="20" fill="#C58A16"/>
  <text x="530" y="596" text-anchor="middle" class="step">2</text>
  <text x="530" y="557" text-anchor="middle" class="small">Weiterleitung</text>

  <!-- Recursive resolver -->
  <g transform="translate(605 425)">
    <rect x="0" y="0" width="310" height="330" rx="26" fill="#FFF8E8" stroke="#D9AE43" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="155" cy="68" r="38" fill="#FFF0C6" stroke="#A36D0E" stroke-width="4"/>
    <path d="M136 68 H174 M155 49 V87 M142 55 C153 64 157 75 168 82 M168 55 C157 64 153 75 142 82" fill="none" stroke="#A36D0E" stroke-width="3"/>
    <text x="155" y="133" text-anchor="middle" class="card-title">Rekursiver Resolver</text>
    <text x="155" y="163" text-anchor="middle" class="body">Provider oder öffentlicher</text>
    <text x="155" y="189" text-anchor="middle" class="body">DNS-Dienst</text>
    <line x1="45" y1="215" x2="265" y2="215" stroke="#E4C46E" stroke-width="2"/>
    <text x="155" y="250" text-anchor="middle" class="body">fragt die Hierarchie ab</text>
    <text x="155" y="279" text-anchor="middle" class="body">und speichert Antworten</text>
    <text x="155" y="308" text-anchor="middle" class="body">für weitere Anfragen</text>
  </g>

  <!-- Step 3 connection to hierarchy -->
  <line x1="915" y1="590" x2="990" y2="590" stroke="#7C638F" stroke-width="5"/>
  <text x="953" y="570" text-anchor="middle" class="small">Abfrage</text>

  <!-- DNS hierarchy -->
  <rect x="990" y="150" width="550" height="650" rx="30" fill="#F2EEF5" stroke="#AA91B9" stroke-width="3"/>
  <text x="1030" y="200" class="section" fill="#684878">DNS-Hierarchie im Internet</text>
  <text x="1030" y="230" class="small">Der Resolver folgt den Verweisen von oben nach unten.</text>

  <!-- Hierarchy spine -->
  <line x1="1070" y1="315" x2="1070" y2="685" stroke="#7C638F" stroke-width="5"/>

  <!-- Root -->
  <circle cx="1070" cy="315" r="22" fill="#7C638F"/>
  <text x="1070" y="321" text-anchor="middle" class="step">3</text>
  <g transform="translate(1120 265)">
    <rect x="0" y="0" width="370" height="100" rx="18" fill="#FFFFFF" stroke="#C6B7D0" stroke-width="2"/>
    <text x="24" y="37" class="card-title">Root-Nameserver „.“</text>
    <text x="24" y="69" class="body">kennt die zuständigen .de-Server</text>
  </g>

  <!-- TLD -->
  <circle cx="1070" cy="445" r="22" fill="#7C638F"/>
  <text x="1070" y="451" text-anchor="middle" class="step">4</text>
  <g transform="translate(1120 395)">
    <rect x="0" y="0" width="370" height="100" rx="18" fill="#FFFFFF" stroke="#C6B7D0" stroke-width="2"/>
    <text x="24" y="37" class="card-title">TLD-Nameserver „.de“</text>
    <text x="24" y="69" class="body">kennt den Server für meinefirma.de</text>
  </g>

  <!-- Authoritative -->
  <circle cx="1070" cy="575" r="22" fill="#7C638F"/>
  <text x="1070" y="581" text-anchor="middle" class="step">5</text>
  <g transform="translate(1120 520)">
    <rect x="0" y="0" width="370" height="110" rx="18" fill="#FFFFFF" stroke="#C6B7D0" stroke-width="2"/>
    <text x="24" y="37" class="card-title">Autoritativer Nameserver</text>
    <text x="24" y="68" class="body">verwaltet die Einträge von</text>
    <text x="24" y="94" class="body">meinefirma.de</text>
  </g>

  <!-- Result -->
  <circle cx="1070" cy="685" r="22" fill="#237A57"/>
  <text x="1070" y="691" text-anchor="middle" class="step">6</text>
  <g transform="translate(1120 650)">
    <rect x="0" y="0" width="370" height="80" rx="18" fill="#E5F2EC" stroke="#7EAD99" stroke-width="2"/>
    <text x="24" y="33" class="body">Antwort:</text>
    <text x="24" y="62" class="record">www → 203.0.113.20</text>
  </g>

  <!-- Return and cache summary -->
  <rect x="145" y="845" width="1310" height="85" rx="22" fill="#E5F2EC" stroke="#7EAD99" stroke-width="2"/>
  <circle cx="195" cy="887" r="22" fill="#237A57"/>
  <text x="195" y="893" text-anchor="middle" class="step">7</text>
  <text x="235" y="880" class="card-title">Antwort zurück zum Mitarbeiter-PC</text>
  <text x="235" y="911" class="body">Resolver und OpenWrt können die IP zwischenspeichern – die nächste Anfrage ist dadurch schneller.</text>

  <text x="800" y="970" text-anchor="middle" class="small">Vereinfachte Darstellung · 203.0.113.20 ist eine Beispieladresse für Dokumentationen.</text>
</svg>
