<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Übersicht des virtuellen Firmennetzes</title>
  <desc id="desc">Das Internet ist über den WAN-Anschluss mit der OpenWrt-Router-VM verbunden. OpenWrt, Mitarbeiter-PC und Debian-Webserver befinden sich gemeinsam im internen VirtualBox-Netz firma-lan.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#173B2E" flood-opacity="0.11"/>
    </filter>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #18251F; }
      .title { font-size: 42px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #5B6B64; }
      .zone-title { font-size: 28px; font-weight: 700; fill: #195E43; }
      .zone-subtitle { font-size: 19px; fill: #466259; }
      .role { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; fill: #527067; }
      .node-title { font-size: 25px; font-weight: 700; }
      .ip { font-size: 22px; font-weight: 700; fill: #176A49; }
      .body { font-size: 18px; fill: #43554E; }
      .label { font-size: 17px; font-weight: 700; }
      .note { font-size: 18px; fill: #344940; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#F8FAF9"/>

  <text x="800" y="64" text-anchor="middle" class="title">Virtuelles Firmennetz – Überblick</text>
  <text x="800" y="101" text-anchor="middle" class="subtitle">Nordtritt Gummistiefel GmbH</text>

  <!-- Internet outside the company LAN -->
  <g transform="translate(65 310)">
    <rect x="0" y="0" width="285" height="165" rx="24" fill="#FFF8E8" stroke="#D9AE43" stroke-width="2" filter="url(#shadow)"/>
    <g transform="translate(84 28)" fill="none" stroke="#95630D" stroke-width="5">
      <path d="M6 45 C6 31 17 22 31 23 C36 10 52 6 64 14 C76 8 92 17 94 32 C107 33 115 42 115 53 C115 65 105 73 94 73 H27 C15 73 6 63 6 51 Z"/>
    </g>
    <text x="142" y="121" text-anchor="middle" class="node-title">Internet</text>
    <text x="142" y="147" text-anchor="middle" class="body">außerhalb des Firmennetzes</text>
  </g>

  <!-- Shared LAN zone -->
  <rect x="405" y="145" width="1130" height="625" rx="32" fill="#EAF4EF" stroke="#78A995" stroke-width="3"/>
  <text x="450" y="201" class="zone-title">Internes Firmennetz „firma-lan“</text>
  <text x="450" y="235" class="zone-subtitle">VirtualBox-internes Netzwerk · 192.168.1.0/24 · gemeinsamer virtueller Switch</text>

  <!-- WAN connection, deliberately without direction arrows -->
  <line x1="350" y1="393" x2="460" y2="393" stroke="#C58A16" stroke-width="6"/>
  <circle cx="350" cy="393" r="7" fill="#C58A16"/>
  <circle cx="460" cy="393" r="7" fill="#C58A16"/>
  <rect x="354" y="341" width="112" height="35" rx="17" fill="#FFF0C6"/>
  <text x="410" y="365" text-anchor="middle" class="label" fill="#80550C">WAN · NAT</text>

  <!-- Router VM -->
  <g transform="translate(460 285)">
    <rect x="0" y="0" width="300" height="250" rx="24" fill="#FFFFFF" stroke="#9FC4B4" stroke-width="2" filter="url(#shadow)"/>
    <rect x="22" y="20" width="108" height="30" rx="15" fill="#E3F1EB"/>
    <text x="76" y="41" text-anchor="middle" class="role">ROUTER-VM</text>
    <g transform="translate(24 74)" fill="none" stroke="#176A49" stroke-width="4">
      <rect x="0" y="0" width="72" height="47" rx="9"/>
      <line x1="13" y1="16" x2="59" y2="16"/>
      <circle cx="18" cy="34" r="4" fill="#176A49" stroke="none"/>
      <circle cx="34" cy="34" r="4" fill="#176A49" stroke="none"/>
      <path d="M50 36 L58 28 L66 36"/>
    </g>
    <text x="115" y="92" class="node-title">OpenWrt</text>
    <text x="115" y="123" class="ip">192.168.1.1</text>
    <text x="24" y="166" class="body">Gateway für das Internet</text>
    <text x="24" y="197" class="body">DHCP · DNS · Firewall</text>
    <text x="24" y="228" class="body">verbindet LAN und WAN</text>
  </g>

  <!-- Employee VM -->
  <g transform="translate(825 285)">
    <rect x="0" y="0" width="300" height="250" rx="24" fill="#FFFFFF" stroke="#AFC6D5" stroke-width="2" filter="url(#shadow)"/>
    <rect x="22" y="20" width="105" height="30" rx="15" fill="#EAF0F6"/>
    <text x="74" y="41" text-anchor="middle" class="role" fill="#496779">CLIENT-VM</text>
    <g transform="translate(24 72)" fill="none" stroke="#416981" stroke-width="4">
      <rect x="0" y="0" width="75" height="49" rx="6"/>
      <path d="M-6 62 H81 L73 49 H2 Z"/>
    </g>
    <text x="115" y="92" class="node-title">Mitarbeiter-PC</text>
    <text x="115" y="123" class="ip">192.168.1.103</text>
    <text x="24" y="166" class="body">Arbeitsplatz und Browser</text>
    <text x="24" y="197" class="body">bezieht Daten per DHCP</text>
    <text x="24" y="228" class="body">nutzt Intranet und Internet</text>
  </g>

  <!-- Server VM -->
  <g transform="translate(1190 285)">
    <rect x="0" y="0" width="300" height="250" rx="24" fill="#FFFFFF" stroke="#C8AEBB" stroke-width="2" filter="url(#shadow)"/>
    <rect x="22" y="20" width="107" height="30" rx="15" fill="#F3EAF0"/>
    <text x="75" y="41" text-anchor="middle" class="role" fill="#765365">SERVER-VM</text>
    <g transform="translate(27 70)" fill="none" stroke="#7C4964" stroke-width="4">
      <rect x="0" y="0" width="68" height="58" rx="7"/>
      <line x1="12" y1="17" x2="55" y2="17"/>
      <line x1="12" y1="34" x2="55" y2="34"/>
      <circle cx="17" cy="47" r="4" fill="#7C4964" stroke="none"/>
    </g>
    <text x="115" y="92" class="node-title">Webserver</text>
    <text x="115" y="123" class="ip">192.168.1.193</text>
    <text x="24" y="166" class="body">Debian mit Nginx</text>
    <text x="24" y="197" class="body">internes Mitarbeiterportal</text>
    <text x="24" y="228" class="body">stellt Webseiten bereit</text>
  </g>

  <!-- One shared LAN bus, no arrows -->
  <line x1="610" y1="535" x2="610" y2="610" stroke="#237A57" stroke-width="5"/>
  <line x1="975" y1="535" x2="975" y2="610" stroke="#237A57" stroke-width="5"/>
  <line x1="1340" y1="535" x2="1340" y2="610" stroke="#237A57" stroke-width="5"/>
  <line x1="610" y1="610" x2="1340" y2="610" stroke="#237A57" stroke-width="7"/>
  <circle cx="610" cy="610" r="9" fill="#237A57"/>
  <circle cx="975" cy="610" r="9" fill="#237A57"/>
  <circle cx="1340" cy="610" r="9" fill="#237A57"/>
  <text x="975" y="651" text-anchor="middle" class="label" fill="#176A49">Alle drei VMs sind mit demselben virtuellen Switch verbunden.</text>

  <!-- Two concise takeaways -->
  <g transform="translate(495 692)">
    <circle cx="0" cy="0" r="8" fill="#237A57"/>
    <text x="19" y="7" class="note">PC ↔ Webserver: direkte Kommunikation im LAN</text>
  </g>
  <g transform="translate(1005 692)">
    <circle cx="0" cy="0" r="8" fill="#C58A16"/>
    <text x="19" y="7" class="note">Verkehr ins Internet: über OpenWrt</text>
  </g>

  <text x="800" y="837" text-anchor="middle" class="subtitle">OpenWrt besitzt zwei Anschlüsse: WAN zum Internet und LAN zum gemeinsamen Firmennetz.</text>
</svg>
