<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">VirtualBox NAT – Rückweg</title>
  <desc id="desc">Der Zielserver antwortet an die Beispiel-Host-IP 192.168.1.50. VirtualBox NAT findet die gespeicherte Zuordnung und leitet das Paket an die virtuelle Maschine 10.0.2.15 weiter.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#15803d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #526077; }
      .kicker { font-size: 14px; font-weight: 600; letter-spacing: 0.6px; fill: #64748b; }
      .name { font-size: 23px; font-weight: 700; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; font-weight: 600; }
      .detail { font-size: 15px; fill: #526077; }
      .packet { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; fill: #166534; }
      .map-label { font-size: 14px; font-weight: 600; fill: #64748b; }
      .map-value { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; font-weight: 600; }
      .note { font-size: 15px; fill: #526077; }
    </style>
  </defs>

  <rect width="1200" height="580" fill="#ffffff"/>
  <text x="54" y="55" class="title">VirtualBox NAT – Rückweg</text>
  <text x="54" y="84" class="subtitle">Der Zielserver antwortet; NAT ordnet die Antwort der VM zu.</text>

  <g filter="url(#shadow)">
    <rect x="50" y="142" width="290" height="220" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="455" y="142" width="290" height="220" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
    <rect x="860" y="142" width="290" height="220" rx="18" fill="#f0fdf4" stroke="#bbf7d0"/>
  </g>

  <text x="78" y="180" class="kicker">VIRTUELLE MASCHINE</text>
  <text x="78" y="217" class="name">Gast-System</text>
  <text x="78" y="254" class="ip">10.0.2.15:49152</text>
  <text x="78" y="291" class="detail">Empfängt die Antwort</text>
  <text x="78" y="317" class="detail">über das private Netz</text>

  <text x="483" y="180" class="kicker">AUF DEM HOST</text>
  <text x="483" y="217" class="name">VirtualBox NAT</text>
  <text x="483" y="254" class="ip">192.168.1.50:61001</text>
  <text x="483" y="291" class="detail">Findet die Zuordnung</text>
  <text x="483" y="317" class="detail">und ersetzt das Ziel</text>

  <text x="888" y="180" class="kicker">EXTERNES NETZ</text>
  <text x="888" y="217" class="name">Zielserver</text>
  <text x="888" y="254" class="ip">203.0.113.10:443</text>
  <text x="888" y="291" class="detail">Antwortet an die Host-IP</text>
  <text x="888" y="317" class="detail">und den gemerkten Port</text>

  <line x1="447" y1="236" x2="357" y2="236" stroke="#15803d" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="402" y="206" text-anchor="middle" class="packet">neues Ziel</text>
  <text x="402" y="337" text-anchor="middle" class="packet">10.0.2.15</text>

  <line x1="852" y1="236" x2="762" y2="236" stroke="#15803d" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="807" y="206" text-anchor="middle" class="packet">Ziel</text>
  <text x="807" y="337" text-anchor="middle" class="packet">192.168.1.50</text>

  <rect x="205" y="408" width="790" height="78" rx="14" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="235" y="437" class="map-label">NAT-TABELLE – GEFUNDENE ZUORDNUNG</text>
  <text x="235" y="468" class="map-value">192.168.1.50:61001  ↔  10.0.2.15:49152</text>

  <circle cx="191" cy="529" r="4" fill="#15803d"/>
  <text x="206" y="535" class="note">Ohne vorhandene Zuordnung brauchen neue Verbindungen von außen eine Portweiterleitung.</text>
</svg>
