<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">VirtualBox NAT – Hinweg</title>
  <desc id="desc">Eine virtuelle Maschine mit der Adresse 10.0.2.15 sendet über VirtualBox NAT. NAT ersetzt die private Quelladresse durch die Beispiel-Host-IP 192.168.1.50 und merkt sich die Portzuordnung.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #526077; }
      .kicker { font-size: 14px; font-weight: 600; letter-spacing: 0.6px; fill: #64748b; }
      .name { font-size: 23px; font-weight: 700; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; font-weight: 600; }
      .detail { font-size: 15px; fill: #526077; }
      .packet { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; fill: #1d4ed8; }
      .map-label { font-size: 14px; font-weight: 600; fill: #64748b; }
      .map-value { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; font-weight: 600; }
      .note { font-size: 15px; fill: #526077; }
    </style>
  </defs>

  <rect width="1200" height="580" fill="#ffffff"/>
  <text x="54" y="55" class="title">VirtualBox NAT – Hinweg</text>
  <text x="54" y="84" class="subtitle">Die VM startet eine Verbindung zum Zielserver.</text>

  <g filter="url(#shadow)">
    <rect x="50" y="142" width="290" height="220" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="455" y="142" width="290" height="220" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
    <rect x="860" y="142" width="290" height="220" rx="18" fill="#f0fdf4" stroke="#bbf7d0"/>
  </g>

  <text x="78" y="180" class="kicker">VIRTUELLE MASCHINE</text>
  <text x="78" y="217" class="name">Gast-System</text>
  <text x="78" y="254" class="ip">10.0.2.15:49152</text>
  <text x="78" y="291" class="detail">Privates VirtualBox-Netz</text>
  <text x="78" y="317" class="detail">Gateway: 10.0.2.2</text>

  <text x="483" y="180" class="kicker">AUF DEM HOST</text>
  <text x="483" y="217" class="name">VirtualBox NAT</text>
  <text x="483" y="254" class="ip">192.168.1.50:61001</text>
  <text x="483" y="291" class="detail">Beispiel-Host-IP im LAN</text>
  <text x="483" y="317" class="detail">ersetzt die Quelladresse</text>

  <text x="888" y="180" class="kicker">EXTERNES NETZ</text>
  <text x="888" y="217" class="name">Zielserver</text>
  <text x="888" y="254" class="ip">203.0.113.10:443</text>
  <text x="888" y="291" class="detail">Sieht die VM-Adresse nicht</text>
  <text x="888" y="317" class="detail">Quelle ist die Host-IP</text>

  <line x1="348" y1="236" x2="438" y2="236" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="393" y="206" text-anchor="middle" class="packet">Quelle</text>
  <text x="393" y="337" text-anchor="middle" class="packet">10.0.2.15</text>

  <line x1="753" y1="236" x2="843" y2="236" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="798" y="206" text-anchor="middle" class="packet">neue Quelle</text>
  <text x="798" y="337" text-anchor="middle" class="packet">192.168.1.50</text>

  <rect x="205" y="408" width="790" height="78" rx="14" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="235" y="437" class="map-label">NAT-TABELLE – GEMERKTE ZUORDNUNG</text>
  <text x="235" y="468" class="map-value">10.0.2.15:49152  ↔  192.168.1.50:61001</text>

  <circle cx="222" cy="529" r="4" fill="#2563eb"/>
  <text x="237" y="535" class="note">Der Zielserver kennt nur die übersetzte Host-Adresse, nicht die private VM-Adresse.</text>
</svg>
